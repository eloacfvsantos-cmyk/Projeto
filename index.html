<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Médias</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="calculator">

            <h1>Calculadora de Médias</h1>

            <p class="subtitle">
                Digite as notas do aluno para calcular a média.
            </p>

            <div id="notasContainer">

                <div class="nota-item">
                    <label>Nota 1</label>

                    <input
                        type="number"
                        class="nota"
                        min="0"
                        max="10"
                        step="0.01"
                        placeholder="Ex.: 7.5"
                    >

                    <button
                        type="button"
                        class="btn-remover"
                        onclick="removerNota(this)"
                        title="Remover nota"
                    >
                        ×
                    </button>
                </div>

                <div class="nota-item">
                    <label>Nota 2</label>

                    <input
                        type="number"
                        class="nota"
                        min="0"
                        max="10"
                        step="0.01"
                        placeholder="Ex.: 8.0"
                    >

                    <button
                        type="button"
                        class="btn-remover"
                        onclick="removerNota(this)"
                        title="Remover nota"
                    >
                        ×
                    </button>
                </div>

            </div>

            <div class="botoes">

                <button
                    type="button"
                    class="btn adicionar"
                    onclick="adicionarNota()"
                >
                    + Adicionar nota
                </button>

                <button
                    type="button"
                    class="btn calcular"
                    onclick="calcularMedia()"
                >
                    Calcular média
                </button>

                <button
                    type="button"
                    class="btn limpar"
                    onclick="limparTudo()"
                >
                    Limpar
                </button>

            </div>

            <div id="resultado" class="resultado">
                <span class="resultado-titulo">Sua média aparecerá aqui</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
